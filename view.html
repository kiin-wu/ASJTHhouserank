<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>HouseRank 公开分数｜全网云端同步</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:#141422;color:#fff;padding:24px;}
h1{text-align:center;margin-bottom:12px;font-size:32px;}
.section-title{text-align:center;font-size:24px;margin:28px 0 12px;color:#ffd700;}
.container{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;}
.card{border-radius:18px;padding:32px 12px;text-align:center;box-shadow:0 4px 14px #0005;}
.zhong{background:#d62828;}
.xin{background:#2a9d48;}
.du{background:#f9ca24;color:#111;}
.jing{background:#1e78c2;}
.group-zh{font-size:30px;font-weight:bold;margin-bottom:2px;}
.group-en{font-size:14px;opacity:0.85;margin-bottom:8px;}
.score-num{font-size:60px;font-weight:bold;}
.tip{text-align:center;margin-top:14px;color:#2ecc71;font-size:14px;}
</style>
</head>
<body>
<h1>House Rank 忠信笃敬计分</h1>
<div class="tip">🌐 云端实时同步｜全校设备分数统一</div>

<div class="section-title">📚 小学部</div>
<div class="container">
    <div class="card zhong"><div class="group-zh">忠</div><div class="group-en">Loyalty</div><div class="score-num" id="pri_zhong">0</div></div>
    <div class="card xin"><div class="group-zh">信</div><div class="group-en">Sincerity</div><div class="score-num" id="pri_xin">0</div></div>
    <div class="card du"><div class="group-zh">笃</div><div class="group-en">Integrity</div><div class="score-num" id="pri_du">0</div></div>
    <div class="card jing"><div class="group-zh">敬</div><div class="group-en">Respect</div><div class="score-num" id="pri_jing">0</div></div>
</div>

<div class="section-title">🎓 初中部</div>
<div class="container">
    <div class="card zhong"><div class="group-zh">忠</div><div class="group-en">Loyalty</div><div class="score-num" id="jun_zhong">0</div></div>
    <div class="card xin"><div class="group-zh">信</div><div class="group-en">Sincerity</div><div class="score-num" id="jun_xin">0</div></div>
    <div class="card du"><div class="group-zh">笃</div><div class="group-en">Integrity</div><div class="score-num" id="jun_du">0</div></div>
    <div class="card jing"><div class="group-zh">敬</div><div class="group-en">Respect</div><div class="score-num" id="jun_jing">0</div></div>
</div>

<div class="section-title">🏆 总 分（小学+初中）</div>
<div class="container">
    <div class="card zhong"><div class="group-zh">忠</div><div class="group-en">Loyalty</div><div class="score-num" id="tot_zhong">0</div></div>
    <div class="card xin"><div class="group-zh">信</div><div class="group-en">Sincerity</div><div class="score-num" id="tot_xin">0</div></div>
    <div class="card du"><div class="group-zh">笃</div><div class="group-en">Integrity</div><div class="score-num" id="tot_du">0</div></div>
    <div class="card jing"><div class="group-zh">敬</div><div class="group-en">Respect</div><div class="score-num" id="tot_jing">0</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
const API_URL = "https://api.jsonbin.io/v3/b/66f89d41e41b4d34e4977777";
let globalScore = {pri:{zhong:0,xin:0,du:0,jing:0},jun:{zhong:0,xin:0,du:0,jing:0}};

async function loadData(){
    try{
        let res = await axios.get(API_URL);
        if(res.data.record) globalScore = res.data.record;
        render();
    }catch(e){}
}

function render(){
    document.getElementById("pri_zhong").innerText=globalScore.pri.zhong;
    document.getElementById("pri_xin").innerText=globalScore.pri.xin;
    document.getElementById("pri_du").innerText=globalScore.pri.du;
    document.getElementById("pri_jing").innerText=globalScore.pri.jing;

    document.getElementById("jun_zhong").innerText=globalScore.jun.zhong;
    document.getElementById("jun_xin").innerText=globalScore.jun.xin;
    document.getElementById("jun_du").innerText=globalScore.jun.du;
    document.getElementById("jun_jing").innerText=globalScore.jun.jing;

    let tot = {
        zhong:globalScore.pri.zhong+globalScore.jun.zhong,
        xin:globalScore.pri.xin+globalScore.jun.xin,
        du:globalScore.pri.du+globalScore.jun.du,
        jing:globalScore.pri.jing+globalScore.jun.jing
    };
    document.getElementById("tot_zhong").innerText=tot.zhong;
    document.getElementById("tot_xin").innerText=tot.xin;
    document.getElementById("tot_du").innerText=tot.du;
    document.getElementById("tot_jing").innerText=tot.jing;
}

setInterval(loadData,1200);
loadData();
</script>
</body>
</html>
